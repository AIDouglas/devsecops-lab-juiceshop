language: EN
tracing_opt_out: true

# Modo estricto: cualquier hallazgo rompe el pipeline
strict: true

output:
  format: CSV
  file_path: fluidattacks-results.csv

sast:
  include:
    - .
  exclude:
    - glob(**/node_modules/**)
    - glob(**/frontend/dist/**)
    - glob(**/dist/**)

sca:
  include:
    - .
  exclude:
    - glob(**/node_modules/**)

ss:
  include:
    - .
  exclude:
    - glob(**/node_modules/**)
