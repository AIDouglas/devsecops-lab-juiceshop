language: EN
tracing_opt_out: true

# Rompe el pipeline solo si hay hallazgos de severidad alta o critica
strict: true
strictness_threshold: high

output:
  format: CSV
  file_path: fluidattacks-results.csv

sast:
  include:
    - .
  exclude:
    - glob(**/node_modules/**)
    - glob(**/frontend/dist/**)
    - glob(**/dist/**)

sca:
  include:
    - .
  exclude:
    - glob(**/node_modules/**)

ss:
  include:
    - .
  exclude:
    - glob(**/node_modules/**)
