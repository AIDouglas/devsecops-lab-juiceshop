name: Fluid Attacks Security Scan

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SAST scan
        uses: fluidattacks/sast-action@1.3.0
        id: scan
        with:
          scan_config_path: .github/fluidattacks/config.yaml

      - name: Subir resultados CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-csv-results
          path: fluidattacks-results.csv
          if-no-files-found: ignore

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SCA scan
        uses: fluidattacks/sca-action@1.2.0
        id: scan
        with:
          scan_config_path: .github/fluidattacks/config.yaml

      - name: Subir resultados CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-csv-results
          path: fluidattacks-results.csv
          if-no-files-found: ignore

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: fluidattacks/ss-action@0.3.0
        id: scan
        with:
          scan_config_path: .github/fluidattacks/config.yaml

      - name: Subir resultados CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-csv-results
          path: fluidattacks-results.csv
          if-no-files-found: ignore
